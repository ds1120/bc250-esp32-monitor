[platformio]
default_envs = st7789

[env]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
extra_scripts =
    pre:embed_sd_defaults.py
    post:verify_restart_abi.py
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv
upload_speed = 460800
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DSPI_FREQUENCY=20000000
    -DSPI_READ_FREQUENCY=1000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1

[env:ili9341]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1
    -DPANEL_NAME=\"ILI9341_2\"

[env:st7789]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DPANEL_NAME=\"ST7789\"
